<title>Torre BPO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sidebar preta fixa (padrão Valorizzy) + coluna principal com cabeçalho branco e conteúdo em cards sobre fundo lilás-acinzentado */
:root{
  --bg:#EFEEF4; --surface:#FFFFFF; --surface-2:#F6F5FA; --ink:#16151C; --ink-2:#4A4856; --muted:#8B899C;
  --line:#ECEAF2; --track:#EEEDF4; --hover:#F6F5FA;
  --green:#16A34A; --green-soft:#E7F6EC; --red:#DC2626; --red-soft:#FDECEC;
  --blue:#2563EB; --blue-soft:#E8EEFD; --amber:#B45309; --amber-soft:#FEF3E2;
  --violet:#7C3AED; --violet-soft:#EDE9FE;
  --hero:#16151C; --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.62); --hero-line:rgba(255,255,255,.18);
  --side-a:#000000; --side-b:#141414; --side-ink:#FFFFFF; --side-dim:rgba(255,255,255,.72); --side-faint:rgba(255,255,255,.4); --side-line:rgba(255,255,255,.08);
  --overlay:rgba(14,13,20,.42);
  --shadow:0 1px 2px rgba(20,18,40,.04),0 8px 24px rgba(20,18,40,.05);
  --shadow-lg:0 24px 60px -12px rgba(20,18,40,.28);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0C11; --surface:#17161D; --surface-2:#1F1E26; --ink:#F3F2F7; --ink-2:#C7C5D2; --muted:#8F8D9E;
  --line:#2A2933; --track:#25242D; --hover:#1F1E26;
  --green:#3CC774; --green-soft:rgba(60,199,116,.14); --red:#F46A6A; --red-soft:rgba(244,106,106,.14);
  --blue:#7AA5FF; --blue-soft:rgba(122,165,255,.15); --amber:#F2A541; --amber-soft:rgba(242,165,65,.14);
  --violet:#AE93FB; --violet-soft:rgba(174,147,251,.16);
  --hero:#26252F; --hero-line:rgba(255,255,255,.14);
  --overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0C11; --surface:#17161D; --surface-2:#1F1E26; --ink:#F3F2F7; --ink-2:#C7C5D2; --muted:#8F8D9E;
  --line:#2A2933; --track:#25242D; --hover:#1F1E26;
  --green:#3CC774; --green-soft:rgba(60,199,116,.14); --red:#F46A6A; --red-soft:rgba(244,106,106,.14);
  --blue:#7AA5FF; --blue-soft:rgba(122,165,255,.15); --amber:#F2A541; --amber-soft:rgba(242,165,65,.14);
  --violet:#AE93FB; --violet-soft:rgba(174,147,251,.16);
  --hero:#26252F; --hero-line:rgba(255,255,255,.14);
  --overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{text-wrap:balance}

/* ---------- Shell ---------- */
.app{display:flex;height:100%;width:100%}
.side{position:relative;width:232px;flex-shrink:0;background:linear-gradient(var(--side-a),var(--side-b));color:var(--side-ink);border-right:1px solid var(--side-line);display:flex;flex-direction:column;min-height:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:22px 22px 18px;border-bottom:1px solid var(--side-line);position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;top:-46px;right:-30px;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,0) 68%)}
.brand-mark{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#2E2D3B,#16151C 62%);display:grid;place-items:center;box-shadow:0 4px 12px -3px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14);flex-shrink:0}
.brand-mark svg{width:19px;height:19px}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.3px}
.brand small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.8px;color:rgba(255,255,255,.45);margin-top:2px}
.office{margin:14px 14px 10px;display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--side-ink);text-align:left;width:calc(100% - 28px)}
.office .av{width:30px;height:30px;font-size:11px}
.office > span:not(.av){flex:1;min-width:0;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.office em{display:block;font-style:normal;font-weight:500;font-size:10.5px;color:rgba(255,255,255,.5)}
.nav{flex:1;overflow:hidden auto;padding:4px 14px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-l{font-size:10px;font-weight:800;letter-spacing:.9px;color:var(--side-faint);padding:6px 8px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--side-dim);text-decoration:none;font-size:14px;font-weight:500;transition:background .15s,color .15s}
.nav a svg{width:19px;height:19px;flex-shrink:0;opacity:.8}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:#fff;color:#000;font-weight:700;box-shadow:0 8px 18px -6px rgba(0,0,0,.35)}
.nav a.on svg{opacity:1}
.nav a .bdg{margin-left:auto;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}
.nav a.on .bdg{background:#16151C;color:#fff}
.nav a .bdg.hot{background:#DC2626;color:#fff}
.side-foot{border-top:1px solid var(--side-line);padding:12px 14px}
.side-foot button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px;border-radius:10px;text-align:left;color:var(--side-ink)}
.side-foot button:hover{background:rgba(255,255,255,.07)}
.side-foot b{display:block;font-size:13.5px}
.side-foot small{display:block;font-size:11.5px;color:rgba(255,255,255,.5)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.head{min-height:72px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 32px;gap:16px}
.head-t{display:flex;align-items:center;gap:12px;min-width:0}
.head h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head p{margin:2px 0 0;font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);place-items:center;color:var(--ink-2);flex-shrink:0}
.head-r{display:flex;align-items:center;gap:10px;flex-shrink:0}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-weight:600;font-size:13px;min-width:230px}
.search svg{width:16px;height:16px}
#search-ic{display:grid;place-items:center}
.search kbd{margin-left:auto;font:inherit;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.pillbar{display:flex;align-items:center;gap:2px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.ibtn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink-2);border-radius:10px}
.ibtn:hover{background:var(--surface);color:var(--ink)}
.ibtn svg{width:18px;height:18px}
.ibtn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface-2)}
.content{flex:1;overflow-y:auto;padding:24px 32px 64px;position:relative}
.view{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:12px;animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:11.5px;font-weight:500}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ch > div:first-child{min-width:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-7-5{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.g-5-7{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.g-8-4{grid-template-columns:minmax(0,8fr) minmax(0,4fr)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.btn{position:relative;border:0;border-radius:11px;height:38px;padding:0 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .14s,filter .14s,box-shadow .14s;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn svg{width:16px;height:16px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.g{background:linear-gradient(180deg,#22B35A,#16A34A);color:#fff;border-color:transparent;box-shadow:0 6px 14px -7px rgba(22,163,74,.85),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.r{background:linear-gradient(180deg,#EF4444,#DC2626);color:#fff;border-color:transparent;box-shadow:0 6px 14px -7px rgba(220,38,38,.85)}
.btn.sm{height:32px;padding:0 10px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn kbd{font:inherit;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.2)}
.lnk{border:0;background:none;color:var(--blue);font-weight:700;font-size:12.5px;padding:4px 2px}

.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--track);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink-2);font-weight:700;font-size:12px;padding:6px 11px;border-radius:9px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button .c{opacity:.6;margin-left:4px}

.sel{height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 32px 0 12px;font-weight:700;font-size:13px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5}
.chip svg{width:11px;height:11px}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.info{background:var(--blue-soft);color:var(--blue)}
.chip.wait{background:var(--violet-soft);color:var(--violet)}
.chip.mute{background:var(--track);color:var(--ink-2)}

.av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:.02em;background:var(--c,#555)}
.av.sm{width:24px;height:24px;border-radius:7px;font-size:9.5px}
.av.lg{width:40px;height:40px;border-radius:12px;font-size:13px}
.av.round{border-radius:50%}

.light{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.light.ok{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.light.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.light.bad{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}

/* KPI (padrão Valorizzy) */
.kpi{position:relative;overflow:hidden;border-top:3px solid var(--c,var(--ink));padding:12px 16px 12px;display:flex;flex-direction:column;gap:6px}
.kpi.hero{background:var(--hero);color:var(--hero-ink);border-color:var(--hero);border-top-color:var(--hero)}
.kpi-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:12px;color:var(--ink-2)}
.kpi.hero .kpi-h{color:var(--hero-sub)}
.ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);flex-shrink:0}
.ico svg{width:14px;height:14px}
.kpi.hero .ico{background:rgba(255,255,255,.12);color:#fff}
.kpi-v{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.kpi-f{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.kpi.hero .kpi-f{color:var(--hero-sub)}
.kpi-f b{color:var(--ink);font-weight:800}
.kpi.hero .kpi-f b{color:#fff}
.kpi .spark{display:block;width:100%;height:28px;margin-top:2px}

/* Alertas (insights) */
.ins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ins-c{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:11px 14px 11px 17px;background:var(--surface);border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));border-radius:14px}
.ins-c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.ins-h{display:flex;align-items:center;gap:8px}
.ins-h .ico{width:24px;height:24px}
.ins-t{flex:1;min-width:0;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;font-size:12px;font-weight:600;line-height:1.55;color:var(--ink-2)}
.ins-r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-r b{color:var(--ink);font-weight:800;white-space:nowrap}

/* Listas */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 8px;border-radius:10px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li:hover{background:var(--hover)}
.li-m{min-width:0}
.li-m b{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;min-width:0}
.li-m b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-m small{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11.5px;font-weight:600;margin-top:2px}
.li-v{font-weight:800;font-size:13px;text-align:right;white-space:nowrap}
.li-a{display:flex;gap:4px;justify-content:flex-end}
.li.done{opacity:.4}
.li.done .li-m b span{text-decoration:line-through}

/* Tabelas */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
td.r,th.r{text-align:right}
.cell-c{display:flex;align-items:center;gap:9px}
.cell-c b{font-weight:700}
.cell-c small{display:block;color:var(--muted);font-size:11px;font-weight:600}
input[type="checkbox"]{width:16px;height:16px;accent-color:var(--ink);cursor:pointer}

/* Barras de progresso */
.prog{height:6px;border-radius:99px;background:var(--track);overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;border-radius:99px;background:var(--c,var(--green))}

/* Charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:10.5px;font-weight:600;font-family:var(--font)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.legend i.dash{height:2px;border-radius:0;background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:10px;font-size:12px;font-weight:600;box-shadow:var(--shadow-lg);min-width:140px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip b{display:block;font-size:11px;opacity:.7;margin-bottom:4px;font-weight:700}
.tip div{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}

/* Donut + ranking (padrão Valorizzy) */
.cat-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.donut{position:relative;width:150px;height:150px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.25}
.donut-c small{color:var(--muted);font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.donut-c b{font-size:14px;font-weight:800}
.donut-c span{color:var(--ink-2);font-size:10px;font-weight:600}
.rank{display:grid;gap:1px;min-width:0}
.rk{display:grid;grid-template-columns:9px minmax(0,1fr) 56px 86px;gap:8px;align-items:center;padding:5px 8px;border-radius:8px}
.rk:hover{background:var(--hover)}
.rk i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.rk .nm{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .nm small{color:var(--muted);font-weight:600;font-size:11px;margin-left:4px}
.rk .bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.rk .bar b{display:block;height:100%;background:var(--c);border-radius:99px}
.rk .vl{font-weight:800;font-size:12.5px;text-align:right}

/* Drawer, modal, toast */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:100;box-shadow:var(--shadow-lg);transform:translateX(105%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dr-h h3{margin:0;font-size:16px;font-weight:800}
.dr-b{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}

/* Série de saldo projetado (90 dias) por cliente */
function serieCaixa(c){
  seed = c.id.charCodeAt(0)*31 + c.id.charCodeAt(1);
  const pts = []; let s = c.saldo; const base = c.honor*14;
  for (let i=0;i<=90;i++){
    const d = addD(TODAY, i);
    let ent = d.getDay()===0 ? 0 : base*(0.5+rnd()*0.6)/6;
    let sai = d.getDay()===0 ? 0 : base*(0.2+rnd()*0.45)/6;
    if (d.getDate()===5) sai += base*1.1;
    if (d.getDate()===20) sai += base*0.9;
    if (d.getDate()===10) ent += base*0.7;
    if (c.id==='ca' && i===6) sai += 41200;
    if (c.id==='ca' && i===12) ent += 52000;
    if (c.id==='rs' && (i===5||i===35)) sai += 16000;
    if (i>0) s += ent - sai;
    pts.push({i, d, s, ent: i?ent:0, sai: i?sai:0});
  }
  return pts;
}

function niceTicks(min, max, n=4){

}

function stackedBars(rows, segs, {h=210, W=640}={}){

  const tot = rows.map(r => segs.reduce((a,s)=>a+(r.vals[s.k]||0),0));

  rows.forEach((r,i) => {

    segs.forEach((s,si) => { const v = r.vals[s.k]||0; if (!v) return; const y0=y(acc), y1=y(acc+v); acc+=v; const top = segs.slice(si+1).every(s2=>!(r.vals[s2.k])); const hh=Math.max(0,y0-y1-(acc>v?2:0));

function hbars(items, {max, fmt=v=>brl(v,0)}={}){
  const m = max || Math.max(...items.map(i=>i.v));
  return `<div style="display:flex;flex-direction:column;gap:10px">${items.map(it=>`<div data-tip="${esc(`<b>${it.n}</b>${tipRow(it.cor, it.q, fmt(it.v))}`)}"><div class="row" style="justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px"><span style="color:var(--ink-2)">${it.n}</span><span class="num">${fmt(it.v)} <span style="color:var(--muted);font-weight:600">· ${it.q}</span></span></div><div class="prog" style="height:10px"><i style="width:${it.v/m*100}%;--c:${it.cor}"></i></div></div>`).join('')}</div>`;
}

/* ================= Toast, drawer, palette ================= */
function toast(msg, undo){
  const t = document.createElement('div'); t.className='toast'; t.innerHTML = ic('check',2.5) + `<span>${msg}</span>` + (undo?'<button type="button">Desfazer</button>':'');
  if (undo) $('button', t).onclick = () => { undo(); t.remove(); };
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(), 4200);
}
function openDrawer(title, body, foot=''){
  $('#dr-title').textContent = title; $('#dr-body').innerHTML = body; $('#dr-foot').innerHTML = foot; $('#dr-foot').hidden = !foot;
  $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden','false'); $('#scrim').classList.add('on'); bindTips($('#drawer'));
}
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true'); $('#scrim').classList.remove('on'); }
</script>
<script>
const VIEWS = {};
const state = { carteira:'todos', filaF:'todos', pagF:'abertos', pagCli:'todos', sel:new Set(), doc:1, concCli:'ps', concAcc:0, fluxoCli:'ca', sims:new Set(), relCli:'ps', cliF:'todos' };
const cliOptions = (sel, todos=true) => (todos?`<option value="todos"${sel==='todos'?' selected':''}>Todos os clientes</option>`:'') + CLIENTES.map(c=>`<option value="${c.id}"${sel===c.id?' selected':''}>${esc(c.nome)}</option>`).join('');
const kpi = ({t, v, c, icn, foot, hero, sp}) => `<div class="card kpi${hero?' hero':''}" style="--c:${c}"><div class="kpi-h"><span>${t}</span><span class="ico">${ic(icn)}</span></div><div class="kpi-v num">${v}</div>${sp?spark(sp, hero?'#FFFFFF':c):''}<div class="kpi-f">${foot}</div></div>`;
const dueChip = d => d<0?`<span class="chip bad">${ic('alert')}Venceu ${rel(d)}</span>`:d===0?`<span class="chip warn">${ic('clock')}Vence hoje</span>`:d<=2?`<span class="chip warn">Vence ${rel(d)}</span>`:`<span class="chip mute">${dmy(addD(TODAY,d))}</span>`;

/* ================= Torre de Controle ================= */
VIEWS.torre = {
  t:'Torre de Controle', sub:'Quinta-feira, 15 de outubro · tudo o que precisa de você hoje, em todos os clientes',
  render(){
    const mine = c => state.carteira==='todos' || C[c].an==='AC';
    const pagHoje = PAGAR.filter(p=>p.d===0 && mine(p.cli));
    const totHoje = pagHoje.reduce((a,p)=>a+p.v,0), aprovHoje = pagHoje.filter(p=>['aprovado','agendado'].includes(p.st)).reduce((a,p)=>a+p.v,0);
    const aguard = PAGAR.filter(p=>['aguardando','parcial','enviado'].includes(p.st) && mine(p.cli));
    const docsN = DOCS.filter(d=>d.st!=='lancado' && mine(d.cli));
    const concP = CLIENTES.filter(c=>mine(c.id)).reduce((a,c)=>a + c.conc*9 + (c.conc?2:0),0);
    const emDia = CLIENTES.filter(c=>mine(c.id) && c.conc<=1).length, nCli = CLIENTES.filter(c=>mine(c.id)).length;
    const fila = FILA.filter(f => mine(f.cli) && (state.filaF==='todos' || f.t===state.filaF));
    const cont = k => FILA.filter(f=>mine(f.cli) && (k==='todos'||f.t===k) && !f.done).length;
    const venc = [...Array(10)].map((_,i)=>i).map(i=>{ const d = addD(TODAY,i); return d; }).filter(d=>d.getDay()%6!==0);
    seed = 11;
    const rows = venc.slice(0,8).map((d,i)=>{ const off = Math.round((d-TODAY)/864e5); const its = PAGAR.filter(p=>p.d===off && mine(p.cli)); let ap = its.filter(p=>['aprovado','agendado','pago'].includes(p.st)).reduce((a,p)=>a+p.v,0), ag = its.filter(p=>!['aprovado','agendado','pago'].includes(p.st)).reduce((a,p)=>a+p.v,0); if (off>6){ ap = 6000+rnd()*18000; ag = 3000+rnd()*9000; } return {lab:off===0?'Hoje':WD[d.getDay()], sub:dmy(d), full:`${WD[d.getDay()]}, ${dmy(d)}`, hl:off===0, vals:{ap, ag}}; });
    const fechCount = k => CLIENTES.filter(c=>mine(c.id) && FECH[c.id]===k).length;
    const lst = fila.length ? fila.map(f => { const c = C[f.cli], T = FILA_TIPO[f.t]; return `<div class="li${f.done?' done':''}" data-id="${f.id}"><span class="q-ic" style="--c:${T.c}">${ic(T.ic)}</span><div class="li-m"><b><span>${esc(f.tit)}</span></b><small>${cliTag(c)}<span>${esc(f.det)}</span></small></div><div style="text-align:right">${f.v?`<div class="li-v num">${brl(f.v)}</div>`:''}<div style="margin-top:3px">${f.prazo<0?`<span class="chip bad">${rel(f.prazo)}</span>`:f.prazo===0?`<span class="chip warn">hoje</span>`:`<span class="chip mute">${rel(f.prazo)}</span>`}</div></div><div class="li-a"><button class="btn sm${f.t==='pagar'?' pri':''}" type="button" data-act="${f.id}">${f.acao}</button><button class="mini-ib" type="button" title="Marcar como feito" data-done="${f.id}">${ic('check')}</button></div></div>`; }).join('') : `<div class="empty">${ic('check')}Nada pendente neste filtro.</div>`;
    const health = CLIENTES.filter(c=>mine(c.id)).sort((a,b)=>({bad:0,warn:1,ok:2}[a.saude]-({bad:0,warn:1,ok:2}[b.saude]))).map(c=>`<button class="hc" type="button" data-cli="${c.id}"><div class="hc-t">${av(c)}<div><b>${esc(c.nome)}</b><small>${ANALISTAS[c.an].nome.split(' ')[0]} · ${c.seg.split(' ·')[0]}</small></div><span class="light ${c.saude}" title="${{ok:'Em dia',warn:'Atenção',bad:'Crítico'}[c.saude]}"></span></div><div class="hc-m"><div>Saldo<b class="num ${c.saldo<0?'bad':c.saldo<c.minimo?'warn':''}">${brlK(c.saldo)}</b></div><div>Conciliação<b class="${c.conc>=3?'bad':c.conc>=1?'warn':''}">${c.conc?'D−'+c.conc:'Em dia'}</b></div><div>Pendências<b class="${c.pend+c.aprov>=5?'bad':c.pend+c.aprov>=2?'warn':''}">${c.pend+c.aprov+c.docs}</b></div></div></button>`).join('');
    return `
    <div class="toolbar"><div class="seg" role="group" aria-label="Carteira"><button type="button" data-cart="todos" aria-pressed="${state.carteira==='todos'}">Toda a equipe</button><button type="button" data-cart="AC" aria-pressed="${state.carteira==='AC'}">Minha carteira</button></div>
      <div class="row"><button class="btn" type="button" data-go="documentos">${ic('inbox')}Caixa de documentos</button><button class="btn g" type="button" data-go="pagar">${ic('send')}Montar lotes de pagamento</button></div></div>
    <div class="grid g4">
      ${kpi({t:'A pagar hoje · carteira', v:brl(totHoje), c:'#fff', icn:'wallet', hero:true, sp:[42,38,51,47,60,44,58,62,49,71,66,totHoje/1000], foot:`<span>Aprovado <b class="num">${brlK(aprovHoje)}</b></span><span>Sem aprovação <b class="num">${brlK(totHoje-aprovHoje)}</b></span>`})}
      ${kpi({t:'Aguardando aprovação do cliente', v:brl(aguard.reduce((a,p)=>a+p.v,0)), c:'var(--violet)', icn:'clock', sp:[8,9,7,11,10,12,9,13,aguard.length], foot:`<span><b>${aguard.length} títulos</b> em ${new Set(aguard.map(p=>p.cli)).size} clientes</span><span>mais antigo: 2 dias</span>`})}
      ${kpi({t:'Caixa de documentos', v:`${docsN.length} <span style="font-size:13px;color:var(--muted);font-weight:700">novos</span>`, c:'var(--amber)', icn:'inbox', sp:[14,9,12,7,10,6,8,11,docsN.length], foot:`<span><b>${docsN.filter(d=>d.conf>=90).length}</b> lidos com alta confiança</span><span><b>1</b> duplicidade</span>`})}
      ${kpi({t:'Conciliação pendente', v:`${concP} <span style="font-size:13px;color:var(--muted);font-weight:700">transações</span>`, c:'var(--blue)', icn:'link', sp:[80,72,66,70,58,61,52,49,concP], foot:`<span>Em dia (D−1): <b>${emDia} de ${nCli}</b></span><span>74% automático</span>`})}
    </div>
    <div class="ins">
      <div class="ins-c" style="--c:var(--red)"><div class="ins-h"><span class="ico">${ic('alert')}</span><span class="ins-t">Caixa negativo projetado</span><b class="num">${brlK(-41200)}</b></div><div class="ins-r"><span>Alicerce · em 6 dias (21/10)</span><b>Folha + INSS</b></div><div class="ins-r"><span>Sugestão: antecipar medição</span><button class="lnk" type="button" data-go="fluxo" data-cli="ca">Ver fluxo</button></div></div>
      <div class="ins-c" style="--c:var(--amber)"><div class="ins-h"><span class="ico">${ic('file')}</span><span class="ins-t">Possível boleto duplicado</span><b class="num">${brlK(8420)}</b></div><div class="ins-r"><span>Padaria Sol · Moinho Paulista</span><b>DDA + app</b></div><div class="ins-r"><span>Mesmo código de barras</span><button class="lnk" type="button" data-go="documentos" data-doc="2">Revisar</button></div></div>
      <div class="ins-c" style="--c:var(--violet)"><div class="ins-h"><span class="ico">${ic('timer')}</span><span class="ins-t">SLA em risco este mês</span><b class="num">78%</b></div><div class="ins-r"><span>Sabor da Serra · meta 95%</span><b>4 atrasos</b></div><div class="ins-r"><span>Causa: documentos fora do prazo</span><button class="lnk" type="button" data-go="clientes">Ver clientes</button></div></div>
      <div class="ins-c" style="--c:var(--blue)"><div class="ins-h"><span class="ico">${ic('alert')}</span><span class="ins-t">Valor fora do padrão</span><b class="num">+38%</b></div><div class="ins-r"><span>Bom Grão · Transportadora Rápida Sul</span><b>${brlK(9870)}</b></div><div class="ins-r"><span>Média dos últimos 6 meses: R$ 7,1 mil</span><button class="lnk" type="button" data-go="pagar">Conferir</button></div></div>
    </div>
    <div class="grid g-7-5">
      <section class="card"><div class="ch"><div><h3>Fila do dia</h3><div class="sub">Ordenada por urgência: prazo, valor e SLA do cliente</div></div>
        <div class="seg" role="group" aria-label="Filtrar fila">${[['todos','Tudo'],['pagar','Pagar'],['aprov','Aprovação'],['doc','Documentos'],['conc','Conciliação'],['rotina','Rotinas']].map(([k,n])=>`<button type="button" data-fila="${k}" aria-pressed="${state.filaF===k}">${n}<span class="c">${cont(k)}</span></button>`).join('')}</div></div>
        <div class="list">${lst}</div></section>
      <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
        <section class="card"><div class="ch"><div><h3>Vencimentos dos próximos dias</h3><div class="sub">Contas a pagar somadas de todos os clientes</div></div><div class="legend"><span><i style="--c:var(--blue)"></i>Aprovado</span><span><i style="--c:var(--violet)"></i>Sem aprovação</span></div></div>
          ${stackedBars(rows, [{k:'ap', nome:'Aprovado', cor:'var(--blue)'},{k:'ag', nome:'Sem aprovação', cor:'var(--violet)'}], {W:460, h:220})}</section>
        <section class="card"><div class="ch"><div><h3>Fechamento de setembro</h3><div class="sub">Prazo interno: dia 10 útil · faltam 5 dias</div></div><button class="lnk" type="button" data-go="fechamentos">Abrir quadro</button></div>
          <div class="stack" style="margin-bottom:12px">${FECH_COLS.map(col=>`<i style="--c:${col.c};flex:${fechCount(col.k)}" data-tip="${esc(`<b>${col.n}</b>${tipRow(col.c,'Clientes',fechCount(col.k))}`)}"></i>`).join('')}</div>
          <div class="close-mini">${FECH_COLS.map(col=>`<div class="close-row"><span class="row" style="gap:7px"><span class="light" style="background:${col.c}"></span>${col.n}</span><div class="prog"><i style="width:${fechCount(col.k)/nCli*100}%;--c:${col.c}"></i></div><b class="num" style="text-align:right">${fechCount(col.k)}</b></div>`).join('')}</div></section>
        <section class="card"><div class="ch"><div><h3>Equipe hoje</h3><div class="sub">Tarefas do dia concluídas e SLA do mês</div></div></div>
          <div class="team">${[['AC',9,12,98],['JL',11,19,89],['RS',7,15,90]].map(([k,f,t,sla])=>`<div class="tm"><span class="av round" style="--c:${ANALISTAS[k].cor}">${k}</span><div><div class="row" style="justify-content:space-between"><b>${ANALISTAS[k].nome}</b><span class="num" style="font-size:12px;font-weight:800">${f}/${t}</span></div><div class="prog" style="margin-top:6px"><i style="width:${f/t*100}%;--c:var(--blue)"></i></div><small>${CLIENTES.filter(c=>c.an===k).length} clientes · ${t-f} tarefas restantes</small></div><span class="chip ${sla>=95?'ok':'warn'}">SLA ${sla}%</span></div>`).join('')}</div></section>
      </div>
    </div>
    <section class="card"><div class="ch"><div><h3>Saúde da carteira</h3><div class="sub">Semáforo calculado por conciliação, saldo vs. mínimo, SLA e pendências</div></div><div class="legend"><span><i class="light ok" style="box-shadow:none"></i>Em dia</span><span><i class="light warn" style="box-shadow:none"></i>Atenção</span><span><i class="light bad" style="box-shadow:none"></i>Crítico</span></div></div><div class="health">${health}</div></section>`;
  },
  bind(v){
    $$('[data-cart]', v).forEach(b=>b.onclick=()=>{ state.carteira=b.dataset.cart; render(); });
    $$('[data-fila]', v).forEach(b=>b.onclick=()=>{ state.filaF=b.dataset.fila; render(); });
    $$('[data-done]', v).forEach(b=>b.onclick=()=>{ const f = FILA.find(x=>x.id==b.dataset.done); f.done=!f.done; render(); if (f.done) toast('Tarefa concluída · registrada no histórico do cliente', ()=>{ f.done=false; render(); }); });
    $$('[data-act]', v).forEach(b=>b.onclick=()=>{ const f = FILA.find(x=>x.id==b.dataset.act);
      if (f.t==='conc') return go('conciliacao', {concCli:f.cli});
      if (f.t==='alerta') return go('fluxo', {fluxoCli:f.cli});
      if (f.t==='rotina' && f.cli==='ap') return go('relatorios', {relCli:'ap'});
      f.done = true; render();
      toast({pagar:'Lote marcado como pago · comprovantes serão vinculados na conciliação', aprov:`Lembrete enviado para ${C[f.cli].curto} por WhatsApp e e-mail`, doc:`Pedido reenviado ao cliente com link para envio`, rotina:'Rotina aberta'}[f.t]||'Feito', ()=>{ f.done=false; render(); }); });
    $$('.hc', v).forEach(b=>b.onclick=()=>fichaCliente(b.dataset.cli));
  }
};

/* ================= Documentos ================= */
VIEWS.documentos = {
  t:'Caixa de documentos', sub:'Boletos, notas e comprovantes de todos os canais, lidos automaticamente',
  render(){
    const d = DOCS.find(x=>x.id===state.doc) || DOCS[0]; const c = C[d.cli];
    const novos = DOCS.filter(x=>x.st!=='lancado');
    const list = DOCS.map(x=>{ const o = ORIG[x.orig]; return `<button type="button" class="doc-i${x.id===d.id?' on':''}" data-doc="${x.id}"><span class="src" title="${o[1]}">${ic(o[0])}</span><span style="min-width:0"><b>${esc(x.forn)}</b><small>${cliTag(C[x.cli])}· ${x.tipo} · ${x.quando}</small></span><span style="text-align:right"><div class="num" style="font-weight:800;font-size:12.5px">${brl(x.v)}</div>${x.st==='lancado'?'<span class="chip ok">Lançado</span>':x.st==='duvida'?'<span class="chip warn">Dúvida</span>':x.dup?'<span class="chip warn">Duplicado?</span>':'<span class="chip info">Novo</span>'}</span></button>`; }).join('');
    const isBol = d.tipo==='Boleto';
    const paper = `<div class="paper"><span class="ocr-tag">Leitura automática · ${d.conf}%</span>
      <div class="pp-h"><span class="row" style="gap:10px"><span class="bank">${isBol?'Itaú | 341-7':d.tipo}</span><b>${isBol?'Recibo do sacado':esc(d.tipo)}</b></span></div>
      <div class="ld"><span class="hl">${esc(d.ld)}</span></div>
      <div class="pp-g" style="margin-top:10px">
        <div><small>Beneficiário</small><span class="hl">${esc(d.forn)}</span></div><div><small>Vencimento</small><span class="hl">${d.venc}</span></div>
        <div><small>CNPJ do beneficiário</small><span class="hl">${d.cnpj}</span></div><div><small>Valor do documento</small><span class="hl">${brl(d.v)}</span></div>
        <div><small>Pagador</small><span>${esc(c.nome.toUpperCase())}</span></div><div><small>Nosso número</small><span>109/${String(d.id*7193).padStart(8,'0')}-4</span></div>
        <div style="border-bottom:0"><small>Instruções</small><span>Após o vencimento cobrar multa de 2% e juros de 1% a.m.</span></div><div style="border-bottom:0"><small>Espécie</small><span>R$</span></div>
      </div>${isBol?'<div class="barcode"></div>':''}</div>`;
    const form = `<section class="card form-col" style="display:flex;flex-direction:column;gap:12px">
      <div class="ch" style="margin:0"><div><h3>Lançar como conta a pagar</h3><div class="sub">Campos em roxo vieram da leitura automática</div></div>${av(c)}</div>
      ${d.dup?`<div class="dupe">${ic('alert')}<span>Este código de barras já foi lançado pelo app do cliente em 13/10 (R$ 8.420,00). Confirme antes de lançar para não pagar duas vezes.</span></div>`:''}
      ${d.conf<60?`<div class="dupe">${ic('alert')}<span>Leitura com baixa confiança. Peça ao cliente uma foto mais nítida ou preencha manualmente.</span></div>`:''}
      <div class="field"><label for="f-forn">Fornecedor <span class="conf">${ic('spark')} reconhecido do histórico</span></label><input id="f-forn" class="ai" value="${esc(d.forn)}"></div>
      <div class="grid g2" style="gap:10px"><div class="field"><label for="f-val">Valor</label><input id="f-val" class="ai num" value="${brl(d.v)}"></div><div class="field"><label for="f-venc">Vencimento</label><input id="f-venc" class="ai" value="${d.venc}"></div></div>
      <div class="field"><label for="f-cat">Categoria <span class="conf">${ic('spark')} sugerida</span></label><input id="f-cat" class="ai" value="${esc(d.cat)}"></div>
      <div class="grid g2" style="gap:10px"><div class="field"><label for="f-cc">Conta de pagamento</label><select id="f-cc"><option>Itaú · 12345-6</option><option>Inter · 998877-1</option></select></div><div class="field"><label for="f-apr">Aprovação</label><select id="f-apr"><option>Enviar no lote de quinta</option><option>Pedir agora</option><option>Automática (regra)</option></select></div></div>
      ${d.obs?`<div class="note">${ic('msg')} ${esc(d.obs)}</div>`:''}
      <div class="row" style="justify-content:flex-end;margin-top:2px"><button class="btn" type="button" id="doc-ask">${ic('msg')}Perguntar ao cliente</button><button class="btn pri" type="button" id="doc-ok"${d.st==='lancado'?' disabled':''}>${ic('check')}${d.st==='lancado'?'Já lançado':'Confirmar lançamento'}</button></div>
    </section>`;
    return `<div class="toolbar"><div class="row"><span class="chip info">${novos.length} para triar</span><span class="sub">Canais: app do cliente, e-mail exclusivo por cliente, DDA e WhatsApp</span></div>
      <div class="row"><span class="note" style="padding:6px 10px">${ic('mail')} <b>padaria-sol@docs.camposbpo.com.br</b></span><button class="btn" type="button" id="doc-up">${ic('upload')}Enviar arquivo</button></div></div>
      <div class="inbox"><section class="card" style="padding:10px"><div class="doc-l">${list}</div></section>
      <section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="ch" style="margin:0"><div><h3>${esc(d.tipo)} · ${esc(d.forn)}</h3><div class="sub">${cliTag(c)} · recebido ${d.quando} via ${ORIG[d.orig][1]}</div></div><div class="row"><button class="mini-ib" type="button" title="Baixar">${ic('dl')}</button><button class="mini-ib" type="button" title="Descartar" id="doc-del">${ic('ban')}</button></div></div>${paper}</section>
      ${form}</div>`;
  },
  bind(v){
    $$('[data-doc]', v).forEach(b=>b.onclick=()=>{ state.doc=+b.dataset.doc; render(); });
    $('#doc-ok', v).onclick = () => { const d = DOCS.find(x=>x.id===state.doc); d.st='lancado'; const nx = DOCS.find(x=>x.st!=='lancado'); const prev = state.doc; if (nx) state.doc = nx.id; render(); toast(`Lançado em ${C[d.cli].curto} · entrou no lote de aprovação de quinta`, ()=>{ d.st='novo'; state.doc=prev; render(); }); };
    $('#doc-ask', v).onclick = () => toast('Pergunta enviada ao cliente, ligada a este documento');
    $('#doc-up', v).onclick = () => toast('No sistema real: arraste PDFs ou fotos aqui');
    $('#doc-del', v).onclick = () => toast('Documento descartado');
  }
};

/* ================= Contas a pagar ================= */
VIEWS.pagar = {
  t:'Contas a pagar', sub:'Lotes de pagamento, aprovação do cliente e alçadas',
  render(){
    let rows = PAGAR.filter(p => (state.pagCli==='todos' || p.cli===state.pagCli));
    const f = state.pagF;
    rows = rows.filter(p => f==='abertos' ? p.st!=='pago' : f==='aguardando' ? ['aguardando','parcial','enviado'].includes(p.st) : f==='aprovado' ? ['aprovado','agendado'].includes(p.st) : f==='rascunho' ? p.st==='rascunho' : true).sort((a,b)=>a.d-b.d);

VIEWS.fluxo = {
  t:'Fluxo de caixa', sub:'Realizado e projetado por cliente, com alerta de saldo mínimo',
  render(){
    const c = C[state.fluxoCli]; const pts = serieCaixa(c); const sims = SIMS[c.id] || SIMS.def;
    sims.forEach(s => { if (!state.sims.has(c.id+s.k)) return; pts.forEach(p => { if (p.i>=s.dia) p.s += s.v; if (s.volta && p.i>=s.volta) p.s -= s.v*(s.k==='emp'?1.08:1); }); });
    this._pts = pts; this._min = c.minimo;

function fechDrawer(id){
  const c = C[id], pr = FECH_PROG[id];
  const body = () => `<div class="row">${av(c,'lg')}<div><b style="font-size:15px">${esc(c.nome)}</b><div class="sub">Competência setembro/2026 · ${ANALISTAS[c.an].nome}</div></div></div>
    <div><div class="row" style="justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px"><span>${pr.filter(Boolean).length} de ${pr.length} itens</span><span class="num">${Math.round(pr.filter(Boolean).length/pr.length*100)}%</span></div><div class="prog" style="height:8px"><i style="width:${pr.filter(Boolean).length/pr.length*100}%"></i></div></div>
    <div class="ck">${CHECK.map(([n,auto],i)=>`<div class="ck-i${pr[i]?' on':''}">${auto?`<span class="bx">${pr[i]?ic('check',3):''}</span>`:`<button type="button" class="bx" data-ck="${i}" aria-label="Marcar ${esc(n)}">${pr[i]?ic('check',3):''}</button>`}<span>${n}</span>${auto?`<span class="chip ${pr[i]?'ok':'bad'}">${pr[i]?'verificado':'pendente'}</span>`:''}</div>`).join('')}</div>
    <div class="note">Itens com selo são conferidos pelo sistema. Os outros você marca.</div>`;
  const foot = `<button class="btn" type="button" id="fd-pkg">${ic('dl')}Pacote para a contabilidade</button><button class="btn pri" type="button" id="fd-ok">${ic('lock')}Concluir e travar competência</button>`;
  const wire = () => {
    $$('[data-ck]', $('#drawer')).forEach(b=>b.onclick=()=>{ pr[+b.dataset.ck] = pr[+b.dataset.ck]?0:1; $('#dr-body').innerHTML = body(); wire(); if (state.view==='fechamentos') render(); });
  };
  openDrawer('Checklist de fechamento', body(), foot); wire();
  $('#fd-pkg').onclick = () => toast('Pacote gerado: extratos, comprovantes, NFs e razão · enviado a contabil@escritoriomoraes.com.br');
  $('#fd-ok').onclick = () => { FECH[id]='ok'; FECH_PROG[id] = FECH_PROG[id].map(()=>1); closeDrawer(); render(); toast(`Setembro de ${c.curto} concluído e travado`); };
}

/* ================= Navegação ================= */
const NAV = [
  ['OPERAÇÃO', [['torre','Torre de Controle','radar'],['documentos','Documentos','inbox', ()=>DOCS.filter(d=>d.st!=='lancado').length],['pagar','Contas a Pagar','up', ()=>PAGAR.filter(p=>p.d<=0 && !['pago','agendado'].includes(p.st)).length, true],['receber','Contas a Receber','down'],['conciliacao','Conciliação','link', ()=>47]]],
  ['CLIENTES', [['fluxo','Fluxo de Caixa','trend'],['fechamentos','Fechamentos','checks', ()=>CLIENTES.filter(c=>FECH[c.id]!=='ok').length],['relatorios','Relatórios','bars'],['clientes','Carteira','users']]],
  ['ESCRITÓRIO', [['rentabilidade','Rentabilidade','gauge'],['portal','App do Cliente','phone']]]
];
function drawNav(){
  $('#nav').innerHTML = NAV.map(([g, its]) => `<div class="nav-g"><div class="nav-l">${g}</div>${its.map(([k,n,i,b,hot]) => { const c = b?b():0; return `<a href="#${k}" data-nav="${k}" class="${state.view===k?'on':''}">${ic(i)}<span>${n}</span>${c?`<span class="bdg${hot?' hot':''}">${c}</span>`:''}</a>`; }).join('')}</div>`).join('');
}
function render(){
  const V = VIEWS[state.view]; const sc = $('#content').scrollTop;
  $('#h-title').textContent = V.t; $('#h-sub').textContent = V.sub;
  const view = $('#view'); view.innerHTML = V.render();
  bindTips(view); $$('[data-go]', view).forEach(b=>b.onclick=()=>{ const o={}; if (b.dataset.cli) o.fluxoCli=b.dataset.cli; if (b.dataset.doc) o.doc=+b.dataset.doc; go(b.dataset.go, o); });
  V.bind && V.bind(view); drawNav();
  if (render._same) $('#content').scrollTop = sc;
}
function go(k, opts={}){
  Object.assign(state, opts); const same = state.view===k; state.view = k; render._same = same; render(); render._same = true;
  if (!same) $('#content').scrollTop = 0;
  try { history.replaceState(null,'','#'+k); } catch(e){}
  try { localStorage.setItem('torre-view', k); } catch(e){}
  $('#side').classList.remove('on'); $('#side-scrim').classList.remove('on');
}
window.go = go; window.closeDrawer = closeDrawer;

/* Busca rápida (Ctrl+K) */
function palItems(q){
  q = q.trim().toLowerCase(); const all = [];
  NAV.forEach(([,its])=>its.forEach(([k,n,i])=>all.push({g:'Telas', n, i, run:()=>go(k)})));
  CLIENTES.forEach(c=>all.push({g:'Clientes', n:c.nome, av:c, sm:c.seg, run:()=>fichaCliente(c.id)}));
  PAGAR.forEach(p=>all.push({g:'Contas a pagar', n:p.forn+' · '+brl(p.v), i:'up', sm:C[p.cli].curto, run:()=>go('pagar',{pagCli:p.cli, pagF:'todos'})}));
  return all.filter(x => !q || (x.n+' '+(x.sm||'')).toLowerCase().includes(q)).slice(0, q?14:10);
}
let palIdx = 0;
function drawPal(){
  const its = palItems($('#pal-in').value); let g = '';
  $('#pal-l').innerHTML = its.length ? its.map((x,i)=>{ const head = x.g!==g ? `<div class="pal-g">${(g=x.g).toUpperCase()}</div>` : ''; return head + `<button type="button" class="pal-i${i===palIdx?' on':''}" data-pi="${i}">${x.av?av(x.av,'sm'):`<span class="src" style="width:24px;height:24px">${ic(x.i)}</span>`}<span>${esc(x.n)}</span>${x.sm?`<small>${esc(x.sm)}</small>`:''}</button>`; }).join('') : `<div class="empty">Nada encontrado</div>`;
  $$('[data-pi]', $('#pal-l')).forEach(b=>b.onclick=()=>{ closePal(); its[+b.dataset.pi].run(); });
  drawPal.its = its;
}
function openPal(){ $('#palette').classList.add('on'); $('#scrim').classList.add('on'); $('#pal-in').value=''; palIdx=0; drawPal(); setTimeout(()=>$('#pal-in').focus(), 30); }
function closePal(){ $('#palette').classList.remove('on'); if (!$('#drawer').classList.contains('on')) $('#scrim').classList.remove('on'); }

/* Init */
$('#burger').innerHTML = ic('menu'); $('#search-ic').innerHTML = ic('search');
$('#notif-btn').insertAdjacentHTML('afterbegin', ic('bell')); $('#help-btn').innerHTML = ic('help'); $('#dr-close').innerHTML = ic('x');
function themeIcon(){ const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; $('#theme-btn').innerHTML = ic(dark?'sun':'moon'); }
themeIcon();
$('#theme-btn').onclick = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme = dark?'light':'dark'; themeIcon(); };
$('#burger').onclick = () => { $('#side').classList.add('on'); $('#side-scrim').classList.add('on'); };
$('#side-scrim').onclick = () => { $('#side').classList.remove('on'); $('#side-scrim').classList.remove('on'); };
$('#scrim').onclick = () => { closeDrawer(); closePal(); };
$('#dr-close').onclick = closeDrawer;
$('#search-btn').onclick = openPal;
$('#help-btn').onclick = () => toast('Atalhos: Ctrl+K busca · Esc fecha painéis');
$('#office-btn').onclick = () => toast('Trocaria de escritório (para redes de BPO com várias unidades)');
$('#cfg-btn').onclick = () => toast('Configurações: equipe, rotinas, SLA, modelos e integrações');
$('#notif-btn').onclick = () => openDrawer('Notificações', `<div class="list">${[
  ['var(--green)','check','Dra. Helena aprovou o lote da Clínica Vida','08:12','cv'],
  ['var(--amber)','file','Marcos enviou 1 boleto pelo app','há 12 min','rs'],
  ['var(--red)','alert','Saldo negativo projetado na Alicerce','07:02','ca'],
  ['var(--blue)','link','Open Finance: 214 transações importadas','07:02','ps'],
  ['var(--violet)','msg','Sr. Otávio respondeu sobre a remessa','ontem','db']
].map(([c,i,t,q,cli])=>`<div class="li" style="grid-template-columns:auto minmax(0,1fr)"><span class="q-ic" style="--c:${c}">${ic(i)}</span><div class="li-m"><b><span>${t}</span></b><small>${cliTag(C[cli])}<span>${q}</span></small></div></div>`).join('')}</div><div class="note">Resumo diário por e-mail às 8h · ajustável em Configurações</div>`);
$('#nav').addEventListener('click', e => { const a = e.target.closest('[data-nav]'); if (!a) return; e.preventDefault(); go(a.dataset.nav); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPal(); }
  if (e.key==='Escape'){ closeDrawer(); closePal(); }
  if ($('#palette').classList.contains('on')){
    const its = drawPal.its||[];
    if (e.key==='ArrowDown'){ e.preventDefault(); palIdx=Math.min(its.length-1,palIdx+1); drawPal(); }
    if (e.key==='ArrowUp'){ e.preventDefault(); palIdx=Math.max(0,palIdx-1); drawPal(); }
    if (e.key==='Enter' && its[palIdx]){ e.preventDefault(); closePal(); its[palIdx].run(); }
  }
});
$('#pal-in').addEventListener('input', () => { palIdx=0; drawPal(); });
let start = (location.hash||'').slice(1);
if (!VIEWS[start]) { try { start = localStorage.getItem('torre-view'); } catch(e){ start = null; } }
state.view = VIEWS[start] ? start : 'torre';
render(); render._same = true;
</script>
