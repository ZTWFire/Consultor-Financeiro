<title>Torre BPO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sidebar preta fixa (padrão Valorizzy) + coluna principal com cabeçalho branco e conteúdo em cards sobre fundo lilás-acinzentado */
:root{
  --bg:#EFEEF4; --surface:#FFFFFF; --surface-2:#F6F5FA; --ink:#16151C; --ink-2:#4A4856; --muted:#8B899C;
  --line:#ECEAF2; --track:#EEEDF4; --hover:#F6F5FA;
  --green:#16A34A; --green-soft:#E7F6EC; --red:#DC2626; --red-soft:#FDECEC;
  --blue:#2563EB; --blue-soft:#E8EEFD; --amber:#B45309; --amber-soft:#FEF3E2;
  --violet:#7C3AED; --violet-soft:#EDE9FE;
  --hero:#16151C; --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.62); --hero-line:rgba(255,255,255,.18);
  --side-a:#000000; --side-b:#141414; --side-ink:#FFFFFF; --side-dim:rgba(255,255,255,.72); --side-faint:rgba(255,255,255,.4); --side-line:rgba(255,255,255,.08);
  --overlay:rgba(14,13,20,.42);
  --shadow:0 1px 2px rgba(20,18,40,.04),0 8px 24px rgba(20,18,40,.05);
  --shadow-lg:0 24px 60px -12px rgba(20,18,40,.28);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0C11; --surface:#17161D; --surface-2:#1F1E26; --ink:#F3F2F7; --ink-2:#C7C5D2; --muted:#8F8D9E;
  --line:#2A2933; --track:#25242D; --hover:#1F1E26;
  --green:#3CC774; --green-soft:rgba(60,199,116,.14); --red:#F46A6A; --red-soft:rgba(244,106,106,.14);
  --blue:#7AA5FF; --blue-soft:rgba(122,165,255,.15); --amber:#F2A541; --amber-soft:rgba(242,165,65,.14);
  --violet:#AE93FB; --violet-soft:rgba(174,147,251,.16);
  --hero:#26252F; --hero-line:rgba(255,255,255,.14);
  --overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0C11; --surface:#17161D; --surface-2:#1F1E26; --ink:#F3F2F7; --ink-2:#C7C5D2; --muted:#8F8D9E;
  --line:#2A2933; --track:#25242D; --hover:#1F1E26;
  --green:#3CC774; --green-soft:rgba(60,199,116,.14); --red:#F46A6A; --red-soft:rgba(244,106,106,.14);
  --blue:#7AA5FF; --blue-soft:rgba(122,165,255,.15); --amber:#F2A541; --amber-soft:rgba(242,165,65,.14);
  --violet:#AE93FB; --violet-soft:rgba(174,147,251,.16);
  --hero:#26252F; --hero-line:rgba(255,255,255,.14);
  --overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{text-wrap:balance}

/* ---------- Shell ---------- */
.app{display:flex;height:100%;width:100%}
.side{position:relative;width:232px;flex-shrink:0;background:linear-gradient(var(--side-a),var(--side-b));color:var(--side-ink);border-right:1px solid var(--side-line);display:flex;flex-direction:column;min-height:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:22px 22px 18px;border-bottom:1px solid var(--side-line);position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;top:-46px;right:-30px;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,0) 68%)}
.brand-mark{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#2E2D3B,#16151C 62%);display:grid;place-items:center;box-shadow:0 4px 12px -3px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14);flex-shrink:0}
.brand-mark svg{width:19px;height:19px}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.3px}
.brand small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.8px;color:rgba(255,255,255,.45);margin-top:2px}
.office{margin:14px 14px 10px;display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--side-ink);text-align:left;width:calc(100% - 28px)}
.office .av{width:30px;height:30px;font-size:11px}
.office > span:not(.av){flex:1;min-width:0;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.office em{display:block;font-style:normal;font-weight:500;font-size:10.5px;color:rgba(255,255,255,.5)}
.nav{flex:1;overflow:hidden auto;padding:4px 14px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-l{font-size:10px;font-weight:800;letter-spacing:.9px;color:var(--side-faint);padding:6px 8px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--side-dim);text-decoration:none;font-size:14px;font-weight:500;transition:background .15s,color .15s}
.nav a svg{width:19px;height:19px;flex-shrink:0;opacity:.8}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:#fff;color:#000;font-weight:700;box-shadow:0 8px 18px -6px rgba(0,0,0,.35)}
.nav a.on svg{opacity:1}
.nav a .bdg{margin-left:auto;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}
.nav a.on .bdg{background:#16151C;color:#fff}
.nav a .bdg.hot{background:#DC2626;color:#fff}
.side-foot{border-top:1px solid var(--side-line);padding:12px 14px}
.side-foot button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px;border-radius:10px;text-align:left;color:var(--side-ink)}
.side-foot button:hover{background:rgba(255,255,255,.07)}
.side-foot b{display:block;font-size:13.5px}
.side-foot small{display:block;font-size:11.5px;color:rgba(255,255,255,.5)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.head{min-height:72px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 32px;gap:16px}
.head-t{display:flex;align-items:center;gap:12px;min-width:0}
.head h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head p{margin:2px 0 0;font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);place-items:center;color:var(--ink-2);flex-shrink:0}
.head-r{display:flex;align-items:center;gap:10px;flex-shrink:0}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-weight:600;font-size:13px;min-width:230px}
.search svg{width:16px;height:16px}
#search-ic{display:grid;place-items:center}
.search kbd{margin-left:auto;font:inherit;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.pillbar{display:flex;align-items:center;gap:2px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.ibtn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink-2);border-radius:10px}
.ibtn:hover{background:var(--surface);color:var(--ink)}
.ibtn svg{width:18px;height:18px}
.ibtn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface-2)}
.content{flex:1;overflow-y:auto;padding:24px 32px 64px;position:relative}
.view{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:12px;animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:11.5px;font-weight:500}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ch > div:first-child{min-width:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-7-5{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.g-5-7{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.g-8-4{grid-template-columns:minmax(0,8fr) minmax(0,4fr)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.btn{position:relative;border:0;border-radius:11px;height:38px;padding:0 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .14s,filter .14s,box-shadow .14s;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn svg{width:16px;height:16px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.g{background:linear-gradient(180deg,#22B35A,#16A34A);color:#fff;border-color:transparent;box-shadow:0 6px 14px -7px rgba(22,163,74,.85),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.r{background:linear-gradient(180deg,#EF4444,#DC2626);color:#fff;border-color:transparent;box-shadow:0 6px 14px -7px rgba(220,38,38,.85)}
.btn.sm{height:32px;padding:0 10px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn kbd{font:inherit;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.2)}
.lnk{border:0;background:none;color:var(--blue);font-weight:700;font-size:12.5px;padding:4px 2px}

.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--track);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink-2);font-weight:700;font-size:12px;padding:6px 11px;border-radius:9px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button .c{opacity:.6;margin-left:4px}

.sel{height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 32px 0 12px;font-weight:700;font-size:13px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5}
.chip svg{width:11px;height:11px}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.info{background:var(--blue-soft);color:var(--blue)}
.chip.wait{background:var(--violet-soft);color:var(--violet)}
.chip.mute{background:var(--track);color:var(--ink-2)}

.av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:.02em;background:var(--c,#555)}
.av.sm{width:24px;height:24px;border-radius:7px;font-size:9.5px}
.av.lg{width:40px;height:40px;border-radius:12px;font-size:13px}
.av.round{border-radius:50%}

.light{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.light.ok{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.light.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.light.bad{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}

/* KPI (padrão Valorizzy) */
.kpi{position:relative;overflow:hidden;border-top:3px solid var(--c,var(--ink));padding:12px 16px 12px;display:flex;flex-direction:column;gap:6px}
.kpi.hero{background:var(--hero);color:var(--hero-ink);border-color:var(--hero);border-top-color:var(--hero)}
.kpi-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:12px;color:var(--ink-2)}
.kpi.hero .kpi-h{color:var(--hero-sub)}
.ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);flex-shrink:0}
.ico svg{width:14px;height:14px}
.kpi.hero .ico{background:rgba(255,255,255,.12);color:#fff}
.kpi-v{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.kpi-f{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.kpi.hero .kpi-f{color:var(--hero-sub)}
.kpi-f b{color:var(--ink);font-weight:800}
.kpi.hero .kpi-f b{color:#fff}
.kpi .spark{display:block;width:100%;height:28px;margin-top:2px}

/* Alertas (insights) */
.ins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ins-c{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:11px 14px 11px 17px;background:var(--surface);border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));border-radius:14px}
.ins-c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.ins-h{display:flex;align-items:center;gap:8px}
.ins-h .ico{width:24px;height:24px}
.ins-t{flex:1;min-width:0;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;font-size:12px;font-weight:600;line-height:1.55;color:var(--ink-2)}
.ins-r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-r b{color:var(--ink);font-weight:800;white-space:nowrap}

/* Listas */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 8px;border-radius:10px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li:hover{background:var(--hover)}
.li-m{min-width:0}
.li-m b{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;min-width:0}
.li-m b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-m small{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11.5px;font-weight:600;margin-top:2px}
.li-v{font-weight:800;font-size:13px;text-align:right;white-space:nowrap}
.li-a{display:flex;gap:4px;justify-content:flex-end}
.li.done{opacity:.4}
.li.done .li-m b span{text-decoration:line-through}

/* Tabelas */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
td.r,th.r{text-align:right}
.cell-c{display:flex;align-items:center;gap:9px}
.cell-c b{font-weight:700}
.cell-c small{display:block;color:var(--muted);font-size:11px;font-weight:600}
input[type="checkbox"]{width:16px;height:16px;accent-color:var(--ink);cursor:pointer}

/* Barras de progresso */
.prog{height:6px;border-radius:99px;background:var(--track);overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;border-radius:99px;background:var(--c,var(--green))}

/* Charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:10.5px;font-weight:600;font-family:var(--font)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.legend i.dash{height:2px;border-radius:0;background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:10px;font-size:12px;font-weight:600;box-shadow:var(--shadow-lg);min-width:140px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip b{display:block;font-size:11px;opacity:.7;margin-bottom:4px;font-weight:700}
.tip div{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}

/* Donut + ranking (padrão Valorizzy) */
.cat-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.donut{position:relative;width:150px;height:150px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.25}
.donut-c small{color:var(--muted);font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.donut-c b{font-size:14px;font-weight:800}
.donut-c span{color:var(--ink-2);font-size:10px;font-weight:600}
.rank{display:grid;gap:1px;min-width:0}
.rk{display:grid;grid-template-columns:9px minmax(0,1fr) 56px 86px;gap:8px;align-items:center;padding:5px 8px;border-radius:8px}
.rk:hover{background:var(--hover)}
.rk i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.rk .nm{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .nm small{color:var(--muted);font-weight:600;font-size:11px;margin-left:4px}
.rk .bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.rk .bar b{display:block;height:100%;background:var(--c);border-radius:99px}
.rk .vl{font-weight:800;font-size:12.5px;text-align:right}

/* Drawer, modal, toast */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:100;box-shadow:var(--shadow-lg);transform:translateX(105%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dr-h h3{margin:0;font-size:16px;font-weight:800}
.dr-b{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dr-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.palette{position:fixed;left:50%;top:12vh;transform:translateX(-50%) scale(.98);width:min(560px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);z-index:110;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;overflow:hidden}
.palette.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 18px;font-size:15px;font-weight:600;outline:none}
.pal-l{max-height:50vh;overflow-y:auto;padding:6px}
.pal-i{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;border:0;background:transparent;text-align:left;font-weight:600}
.pal-i:hover,.pal-i.on{background:var(--hover)}
.pal-i small{margin-left:auto;color:var(--muted);font-size:11px;font-weight:700}
.pal-g{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);padding:8px 10px 4px}
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:520px}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 14px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:var(--shadow-lg);pointer-events:auto;animation:tin .2s ease}
.toast svg{width:16px;height:16px;color:var(--green);flex-shrink:0}
.toast button{border:0;background:rgba(127,127,127,.25);color:inherit;font-weight:800;font-size:12px;padding:4px 9px;border-radius:8px;margin-left:6px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.empty{display:grid;place-items:center;text-align:center;padding:30px 10px;color:var(--muted);font-weight:600;gap:6px}
.empty svg{width:28px;height:28px;color:var(--green)}
.note{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:9px 12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.field input,.field select,.field textarea{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 11px;font-weight:600;font-size:13px;min-width:0;width:100%}
.field textarea{height:auto;padding:10px 11px;resize:vertical;line-height:1.5}
.field input.ai{border-color:color-mix(in srgb,var(--violet) 45%,var(--line));background:color-mix(in srgb,var(--violet) 6%,var(--surface))}

/* Responsivo */
@media (max-width:1280px){.ins{grid-template-columns:repeat(2,minmax(0,1fr))}.search{min-width:0}.search span:not(#search-ic){display:none}.search kbd{display:none}}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-7-5,.g-5-7,.g-8-4{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-102%);transition:transform .25s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);width:calc(250px + env(safe-area-inset-left,0px))}
  .side.on{transform:none;box-shadow:var(--shadow-lg)}
  .burger{display:grid}
  .head{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .content{padding:16px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .head h1{font-size:19px}
  .pillbar .ibtn.hide-sm{display:none}
}
@media (max-width:620px){
  .g4,.ins{grid-template-columns:minmax(0,1fr)}
  .head p{display:none}
  .search{width:40px;padding:0;justify-content:center}
  .cat-wrap{grid-template-columns:minmax(0,1fr);justify-items:center}
  .cat-wrap .rank{width:100%}
  .rk{grid-template-columns:9px minmax(0,1fr) 50px 84px}
  .li{grid-template-columns:auto minmax(0,1fr) auto;row-gap:6px}
  .li .li-a{grid-column:2 / -1;justify-content:flex-start}
}
